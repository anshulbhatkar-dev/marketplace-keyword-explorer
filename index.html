<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace Keyword Explorer</title>

<!-- React 18 UMD -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<!-- SheetJS (Excel export) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Babel standalone (in-browser JSX transform) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e2e5ea; --text:#1c2128; --muted:#6b7280;
    --brand:#5b3df5; --brand-weak:#efeafe;
    --green:#0f9d58; --green-weak:#e6f6ec;
    --red:#d93025; --red-weak:#fdeceb;
    --purple:#8e24aa; --purple-weak:#f5e8f8;
    --blue:#1a73e8; --blue-weak:#e8f0fe;
    --amber:#e37400; --amber-weak:#fdeedd;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #root{min-height:100vh;}

  .app{max-width:1400px;margin:0 auto;padding:20px 24px 60px;}
  .app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .app-header h1{font-size:20px;margin:0;font-weight:700;}
  .app-header .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .refresh-btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 14px;
    font-size:13px;cursor:pointer;font-weight:600;color:var(--text);}
  .refresh-btn:hover{background:#fafafa;}
  .refresh-btn:disabled{opacity:.5;cursor:default;}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);}
  .tab-btn{background:none;border:none;padding:10px 16px;font-size:14px;font-weight:600;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}
  .tab-btn:hover{color:var(--text);}

  .banner{border-radius:var(--radius);padding:10px 14px;font-size:13px;margin-bottom:14px;border:1px solid transparent;}
  .banner.warn{background:var(--amber-weak);border-color:#f3d9b1;color:#7a4a05;}
  .banner.error{background:var(--red-weak);border-color:#f3c2bd;color:#8a1f16;}
  .banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px;}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
  .kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .kpi-card .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
  .kpi-card .value{font-size:22px;font-weight:700;margin-top:4px;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;}
  .filters input[type="text"], .filters select, .filters input[type="number"]{
    border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;background:#fff;color:var(--text);}
  .filters input[type="text"]{min-width:200px;}
  .filters label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer;user-select:none;}
  .filters .num-inline{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .filters .num-inline input{width:70px;}
  .filters .spacer{flex:1;}
  .filters .caption{width:100%;font-size:12px;color:var(--muted);margin-top:2px;}

  .multiselect{position:relative;}
  .ms-btn{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;background:#fff;
    color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .ms-btn.active{border-color:var(--brand);color:var(--brand);}
  .ms-caret{font-size:10px;color:var(--muted);}
  .ms-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);
    border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);padding:6px;min-width:190px;max-height:260px;
    overflow:auto;z-index:10;}
  .ms-panel-actions{display:flex;gap:8px;padding:2px 6px 6px;border-bottom:1px solid var(--border);margin-bottom:4px;}
  .ms-panel-actions button{border:none;background:none;color:var(--brand);font-size:12px;font-weight:600;
    cursor:pointer;padding:2px 4px;}
  .ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px;cursor:pointer;border-radius:5px;
    white-space:nowrap;}
  .ms-opt:hover{background:#fafbfc;}

  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:70vh;}
  table.data{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;}
  table.data th, table.data td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border);}
  /* Fixed row height on the virtualized table so the JS windowing math (VROW_HEIGHT)
     matches real layout exactly — otherwise spacer rows drift out of sync with content
     as you scroll. */
  table.data.virtual tbody tr{height:40px;box-sizing:border-box;}
  table.data.virtual tbody td{padding-top:0;padding-bottom:0;}
  table.data th.sortable{cursor:pointer;user-select:none;}
  table.data th.sortable:hover{color:var(--brand);}
  table.data th{position:sticky;top:0;background:#fafbfc;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;
    color:var(--muted);z-index:2;font-weight:700;}
  table.data td.num, table.data th.num{text-align:right;}
  table.data tbody tr:hover{background:#fafbfc;}
  table.data td.kw-cell, table.data th.kw-col{position:sticky;left:0;background:#fff;z-index:1;font-weight:600;}
  table.data th.kw-col{background:#fafbfc;z-index:3;}
  table.data tbody tr:hover td.kw-cell{background:#fafbfc;}

  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge.fire{margin-left:6px;}
  .badge.type-generic{background:var(--blue-weak);color:var(--blue);}
  .badge.type-branded{background:var(--purple-weak);color:var(--purple);}
  .badge.type-competition{background:var(--red-weak);color:var(--red);}

  .cat-primary{font-weight:600;}
  .cat-more{color:var(--muted);font-size:12px;margin-left:4px;cursor:default;}

  .export-btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;
    font-weight:700;cursor:pointer;}
  .export-btn:hover{opacity:.92;}
  .toolbar-row{display:flex;justify-content:flex-end;margin-bottom:10px;}

  .empty-state{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
  .loading-state{padding:40px;text-align:center;color:var(--muted);font-size:14px;}
  .footnote{font-size:11.5px;color:var(--muted);margin-top:8px;}

  .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06);}
  .auth-card h1{font-size:18px;margin:0 0 10px;}
  .auth-card p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5;}
  .auth-btn-slot{display:flex;justify-content:center;}
  .auth-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 24px;
    font-size:12.5px;color:var(--muted);text-align:right;}
  .auth-signout{border:none;background:none;color:var(--brand);font-size:12.5px;font-weight:600;
    cursor:pointer;padding:0;}
</style>
</head>
<body>
<div id="root"></div>

<script type="application/jsx-source" id="app-source">
/* ============================================================================
 * Marketplace Keyword Explorer — Blinkit Suggested Keywords + AZ Running Keywords
 * A common repository for marketplace keyword-opportunity tooling. Blinkit
 * Suggested Keywords sources Blinkit's own reco export; AZ Running Keywords
 * is a standalone Amazon keyword-performance view (no Blinkit tie-in). More
 * marketplaces/tabs can be added under this same app.
 * Single-file React app. Data source: Google Sheets (client-side CSV fetch,
 * no backend). See README.md for setup + deployment.
 * ==========================================================================*/

// ---------------------------------------------------------------------------
// CONFIG — edit these to point at your own sheets. No other code changes
// should be needed to re-point this dashboard at a different workbook.
// ---------------------------------------------------------------------------
const CONFIG = {
  // Bump this on any schema change to force a fresh pull for all users.
  CACHE_VER: 'v1',
  CACHE_TTL_MS: 4 * 60 * 60 * 1000, // 4 hours

  // Workbook that holds both the Blinkit reco export and the AZ snapshot tab.
  RECO_WORKBOOK_ID: '1UkeDfFaziuZZtA6jVixDAu1dsgbWbW6DX1MQcwYtYug',
  RECO_TAB_GID: '244896497',      // "Search reco BK"
  AZ_SNAPSHOT_GID: '1975500102',  // "AZ Search snapshot" (built by the Apps Script — see /google-apps-script)

  // "This Month- Product Listing" tab — the daily per-keyword ad-performance
  // log that BK Running Ads is built from (a different workbook than the two above).
  BK_ADS_WORKBOOK_ID: '1enTpKSWbTqSEEZDo4WRsFj9HwlDjgbpVfUyW5icPGuM',
  BK_ADS_TAB_GID: '1816954201',

  // OPTIONAL — plug in your Sales-import feed (brand, category, units sold)
  // to rank a keyword's categories by revenue for the "primary category"
  // column. Leave WORKBOOK_ID blank to rank categories by search volume
  // instead (a reasonable proxy, just not revenue-true).
  SALES_WORKBOOK_ID: '',
  SALES_TAB_GID: '',
};

// ---------------------------------------------------------------------------
// AUTH — Google Sign-In gate, restricted to one email domain.
// Leave GOOGLE_CLIENT_ID blank to leave the app open (no gate) -- see README
// "Access control" section for how to get a Client ID and turn this on.
// ---------------------------------------------------------------------------
const AUTH_CONFIG = {
  GOOGLE_CLIENT_ID: '715660417203-847ijqq93aqhfmi7noqlkfjt7obkfrkg.apps.googleusercontent.com',
  ALLOWED_DOMAIN: 'mosaicwellness.in',
  SESSION_HOURS: 24, // how long a successful sign-in stays valid before asking again
};

const LOOKBACK_DAYS_RECO = 14;
const LOOKBACK_WEEKS_AZ = 4; // informational only; the Apps Script already trims to 4 weeks
const LOOKBACK_DAYS_BK = 30; // window size for BK Running Ads; the actual DRR divisor is however many distinct days of data fall inside it, not a hardcoded 30

// ---------------------------------------------------------------------------
// IndexedDB cache
// ---------------------------------------------------------------------------
const IDB_NAME = 'marketplace_kwexpl_cache';
const IDB_STORE = 'sheets';

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) { /* best-effort cache */ }
}

// Fetch a tab's CSV via the gviz endpoint (works reliably by gid even on
// link-shared, non-"published to web" workbooks — see README "gotchas").
// Pass force:true (the "Refresh data" button does) to skip the cache read
// entirely — otherwise a manual refresh could silently keep serving data
// that's up to CACHE_TTL_MS old, which defeats the point of the button.
async function fetchSheetCSV(workbookId, gid, cacheKey, force) {
  const key = `mkt_sheet_${CONFIG.CACHE_VER}_${cacheKey}`;
  const cached = await idbGet(key); // read regardless, so a failed forced fetch still has a fallback
  const now = Date.now();
  if (!force && cached && (now - cached.ts) < CONFIG.CACHE_TTL_MS) {
    return { text: cached.text, fromCache: true };
  }
  const url = `https://docs.google.com/spreadsheets/d/${workbookId}/gviz/tq?tqx=out:csv&gid=${gid}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    await idbSet(key, { text, ts: now });
    return { text, fromCache: false };
  } catch (err) {
    if (cached) return { text: cached.text, fromCache: true, stale: true };
    throw err;
  }
}

// ---------------------------------------------------------------------------
// CSV parsing (handles quoted fields with embedded commas/newlines)
// ---------------------------------------------------------------------------
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function normHeader(h) { return String(h || '').toLowerCase().trim(); }

function findHeaderRow(rows, requiredNorms) {
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const norms = rows[i].map(normHeader);
    if (requiredNorms.every(req => norms.some(n => n.indexOf(req) >= 0))) return i;
  }
  return 0;
}

function toNumber(v) {
  if (v === null || v === undefined) return 0;
  const n = Number(String(v).replace(/,/g, '').trim());
  return isNaN(n) ? 0 : n;
}

// Tolerates YYYY-MM-DD and DD-MM-YYYY.
function parseDate(v) {
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function fmtInt(n) {
  return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
}
function fmt1dp(n) {
  return Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
}

// ---------------------------------------------------------------------------
// Keyword Explorer (Blinkit reco) — parse + aggregate
// ---------------------------------------------------------------------------
function parseRecoKeywords(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headerIdx = findHeaderRow(rows, ['keyword', 'brand']);
  const header = rows[headerIdx].map(normHeader);
  const col = (test) => { for (let c = 0; c < header.length; c++) if (test(header[c])) return c; return -1; };
  const ci = {
    brand: col(h => h === 'brand'),
    category: col(h => h === 'category'),
    date: col(h => h.indexOf('downloaded') >= 0 && h.indexOf('date') >= 0),
    keyword: col(h => h === 'keyword'),
    searches: col(h => h.indexOf('search') >= 0 && h.indexOf('30') >= 0),
    ktype: col(h => h.indexOf('keyword type') >= 0),
    asset: col(h => h.indexOf('asset type') >= 0),
    trending: col(h => h.indexOf('trending') >= 0),
  };
  // fallback to fixed indices per documented column order if header names didn't resolve
  const FIXED = { brand: 0, category: 1, date: 2, keyword: 3, searches: 4, ktype: 5, asset: 6, trending: 7 };
  Object.keys(FIXED).forEach(k => { if (ci[k] < 0) ci[k] = FIXED[k]; });

  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const keyword = String(row[ci.keyword] || '').trim();
    const brand = String(row[ci.brand] || '').trim();
    if (!keyword || !brand) continue;
    const trendingRaw = String(row[ci.trending] || '').trim();
    out.push({
      brand,
      category: String(row[ci.category] || '').trim(),
      date: parseDate(row[ci.date]),
      keyword,
      searches: toNumber(row[ci.searches]),
      ktype: String(row[ci.ktype] || '').trim() || 'Generic',
      assetType: String(row[ci.asset] || '').trim(),
      trending: trendingRaw !== '' && !/^(false|no|n|0)$/i.test(trendingRaw),
    });
  }
  return out;
}

function aggregateReco(recs, catRevFn) {
  if (!recs.length) return [];
  let maxDate = null;
  recs.forEach(r => { if (r.date && (!maxDate || r.date > maxDate)) maxDate = r.date; });
  const cutoff = maxDate ? new Date(maxDate.getTime() - (LOOKBACK_DAYS_RECO - 1) * 86400000) : null;
  const windowed = recs.filter(r => !cutoff || !r.date || r.date >= cutoff);

  const groups = {}; // key = brand||keyword
  windowed.forEach(r => {
    const key = `${r.brand}||${r.keyword}`;
    if (!groups[key]) {
      groups[key] = {
        brand: r.brand, keyword: r.keyword, ktype: r.ktype, trending: false,
        searches: 0, categories: {}, // category -> {searches (max), rev}
      };
    }
    const g = groups[key];
    g.trending = g.trending || r.trending;
    g.searches = Math.max(g.searches, r.searches);
    if (r.category) {
      const cat = g.categories[r.category] || { category: r.category, searches: 0 };
      cat.searches = Math.max(cat.searches, r.searches);
      g.categories[r.category] = cat;
    }
  });

  const out = Object.values(groups).map(g => {
    const catList = Object.values(g.categories).map(c => ({
      category: c.category,
      searches: c.searches,
      revenue: catRevFn ? catRevFn(g.brand, c.category) : null,
    }));
    // Rank by revenue when we have it, else fall back to search volume.
    catList.sort((a, b) => {
      if (a.revenue != null && b.revenue != null && a.revenue !== b.revenue) return b.revenue - a.revenue;
      return b.searches - a.searches;
    });
    const primaryCategory = catList.length ? catList[0].category : '';
    const moreCount = Math.max(0, catList.length - 1);
    return {
      brand: g.brand,
      keyword: g.keyword,
      ktype: g.ktype,
      trending: g.trending,
      searches: g.searches,
      categories: catList,
      primaryCategory,
      moreCount,
    };
  });

  out.sort((a, b) => b.searches - a.searches);
  return out;
}

// ---------------------------------------------------------------------------
// Category revenue proxy (optional feed — see CONFIG.SALES_WORKBOOK_ID)
// ---------------------------------------------------------------------------
function parseSalesRows(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headerIdx = findHeaderRow(rows, ['brand', 'category']);
  const header = rows[headerIdx].map(normHeader);
  const col = (test) => { for (let c = 0; c < header.length; c++) if (test(header[c])) return c; return -1; };
  const ci = {
    brand: col(h => h === 'brand'),
    category: col(h => h === 'category'),
    units: col(h => h.indexOf('unit') >= 0),
  };
  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const brand = String(row[ci.brand] || '').trim();
    const category = String(row[ci.category] || '').trim();
    if (!brand || !category) continue;
    out.push({ brand, category, units: toNumber(row[ci.units]) });
  }
  return out;
}

function buildCatRevMap(rows) {
  const map = {};
  rows.forEach(r => {
    const key = `${r.brand}||${r.category}`;
    map[key] = (map[key] || 0) + r.units;
  });
  return map;
}

// ---------------------------------------------------------------------------
// AZ Running Keywords (Amazon snapshot) — parse + aggregate
// ---------------------------------------------------------------------------
function parseAmazonSnapshot(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headerIdx = findHeaderRow(rows, ['search query']);
  const header = rows[headerIdx].map(normHeader);
  const col = (test) => { for (let c = 0; c < header.length; c++) if (test(header[c])) return c; return -1; };
  const ci = {
    brand: col(h => h === 'brand'),
    type: col(h => h === 'type'),
    keyword: col(h => h.indexOf('search query') >= 0),
    volWk: col(h => h.indexOf('search volume') >= 0),
    unitsWk: col(h => h.indexOf('units sold') >= 0),
    weeks: col(h => h === 'weeks'),
  };
  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const keyword = String(row[ci.keyword] || '').trim();
    const brand = String(row[ci.brand] || '').trim();
    if (!keyword || !brand) continue;
    const volWk = toNumber(row[ci.volWk]);
    const unitsWk = toNumber(row[ci.unitsWk]);
    const ktypeRaw = String(row[ci.type] || '').trim().toLowerCase();
    const ktype = ktypeRaw ? ktypeRaw.charAt(0).toUpperCase() + ktypeRaw.slice(1) : 'Generic';
    out.push({
      brand,
      ktype,
      keyword,
      volWk, unitsWk,
      volDay: volWk / 7,
      unitsDay: unitsWk / 7,
      conv: volWk > 0 ? (unitsWk / volWk) : 0,
      weeks: toNumber(row[ci.weeks]) || LOOKBACK_WEEKS_AZ,
    });
  }
  return out;
}

function aggregateAmazon(list) {
  const groups = {};
  list.forEach(r => {
    const key = `${r.brand}||${r.keyword}`;
    if (!groups[key] || r.volDay > groups[key].volDay) groups[key] = r;
  });
  const out = Object.values(groups);
  out.sort((a, b) => b.volDay - a.volDay); // ranked by search volume/day
  return out;
}

function computeBenchmarks(rows) {
  const agg = {}; // brand||type -> {vol, units}
  rows.forEach(r => {
    const key = `${r.brand}||${r.ktype}`;
    if (!agg[key]) agg[key] = { vol: 0, units: 0 };
    agg[key].vol += r.volDay;
    agg[key].units += r.unitsDay;
  });
  const bench = {};
  Object.keys(agg).forEach(k => { bench[k] = agg[k].vol > 0 ? agg[k].units / agg[k].vol : 0; });
  return bench; // conversion ratio (0-1) per brand||type
}

// ---------------------------------------------------------------------------
// BK Running Ads (daily per-keyword ad-performance log) — parse + aggregate
// Source: "This Month- Product Listing" — one row per keyword × campaign ×
// day. Column letters below are exactly what the sheet uses (see README).
// ---------------------------------------------------------------------------
const BK_KTYPE_MAP = { comp: 'Competition', competition: 'Competition', brand: 'Branded', branded: 'Branded', generic: 'Generic' };

function parseBkAdsRows(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headerIdx = findHeaderRow(rows, ['keyword']);
  const header = rows[headerIdx].map(normHeader);
  const col = (test) => { for (let c = 0; c < header.length; c++) if (test(header[c])) return c; return -1; };
  const ci = {
    date: col(h => h.indexOf('date') >= 0),
    keyword: col(h => h === 'keyword'),
    newUsers: col(h => h === 'new users'),
    directSales: col(h => h === 'direct sales'),
    directQty: col(h => h === 'direct quantities sold'),
    estBudget: col(h => h === 'estimated budget consumed'),
    ktype: col(h => h === 'type'),
    brand: col(h => h === 'brand'),
    category: col(h => h.indexOf('category') >= 0),
    compBrand: col(h => h.indexOf('comp brand') >= 0),
  };
  // Fallback to the documented column-letter order if header names didn't resolve.
  // The live sheet's header row is blank for most columns (only Keyword, Type,
  // Brand and a few others have real text) — this fallback is NOT an edge case
  // here, it's the normal path for date/newUsers/directSales/directQty/estBudget.
  // (B, E, N, O, Q, S, AA, AB, AC, AD — 0-indexed below.)
  const FIXED = { date: 1, keyword: 4, newUsers: 13, directSales: 14, directQty: 16, estBudget: 18, ktype: 26, brand: 27, category: 28, compBrand: 29 };
  Object.keys(FIXED).forEach(k => { if (ci[k] < 0) ci[k] = FIXED[k]; });

  const out = [];
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const keyword = String(row[ci.keyword] || '').trim();
    const brand = String(row[ci.brand] || '').trim();
    if (!keyword || !brand) continue;
    const ktypeRaw = String(row[ci.ktype] || '').trim();
    const ktype = BK_KTYPE_MAP[ktypeRaw.toLowerCase()] || ktypeRaw || 'Generic';
    out.push({
      brand,
      keyword,
      ktype,
      category: String(row[ci.category] || '').trim(),
      compBrand: String(row[ci.compBrand] || '').trim(),
      date: parseDate(row[ci.date]),
      newUsers: toNumber(row[ci.newUsers]),
      directSales: toNumber(row[ci.directSales]),
      directQty: toNumber(row[ci.directQty]),
      estBudget: toNumber(row[ci.estBudget]),
    });
  }
  return out;
}

// Sums every row into one line per brand×keyword over the last
// LOOKBACK_DAYS_BK days of data present, then divides by however many
// distinct days actually showed up in that window — so DRR stays accurate
// even if the tracker has gaps and doesn't have a full 30 days for everyone.
function aggregateBkAds(list) {
  if (!list.length) return [];
  let maxDate = null;
  list.forEach(r => { if (r.date && (!maxDate || r.date > maxDate)) maxDate = r.date; });
  // If nothing parsed to a valid date, there's no safe window to sum over —
  // show nothing rather than silently dumping the whole sheet's history into
  // a "daily" figure (which is exactly how this tab's numbers got inflated
  // before the date column's fallback index was fixed).
  if (!maxDate) return [];
  const cutoff = new Date(maxDate.getTime() - (LOOKBACK_DAYS_BK - 1) * 86400000);
  // A row must have its own valid, in-window date to count — a missing/bad
  // date is excluded, never silently treated as "in window".
  const windowed = list.filter(r => r.date && r.date >= cutoff && r.date <= maxDate);

  const dayKeys = new Set();
  windowed.forEach(r => dayKeys.add(r.date.getTime()));
  const daysPresent = dayKeys.size || 1;

  const groups = {};
  windowed.forEach(r => {
    const key = `${r.brand}||${r.keyword}`;
    if (!groups[key]) {
      groups[key] = { brand: r.brand, keyword: r.keyword, ktype: r.ktype, category: r.category, compBrand: r.compBrand,
        newUsers: 0, directSales: 0, directQty: 0, estBudget: 0, lastDate: null };
    }
    const g = groups[key];
    g.newUsers += r.newUsers;
    g.directSales += r.directSales;
    g.directQty += r.directQty;
    g.estBudget += r.estBudget;
    // Type/Category/Comp-brand can in theory drift for the same keyword over
    // time (recategorization) — keep whichever row was seen most recently.
    if (!g.lastDate || (r.date && r.date >= g.lastDate)) {
      if (r.ktype) g.ktype = r.ktype;
      if (r.category) g.category = r.category;
      if (r.compBrand) g.compBrand = r.compBrand;
      g.lastDate = r.date;
    }
  });

  const out = Object.values(groups).map(g => ({
    brand: g.brand,
    keyword: g.keyword,
    ktype: g.ktype || 'Generic',
    category: g.category,
    compBrand: g.compBrand,
    newUsersDay: g.newUsers / daysPresent,
    directQtyDay: g.directQty / daysPresent,
    budgetDay: g.estBudget / daysPresent,
    directSales: g.directSales, // kept as totals for RoAS + benchmark math (ratio is unaffected by the /daysPresent scaling)
    estBudget: g.estBudget,
    roas: g.estBudget > 0 ? g.directSales / g.estBudget : 0,
  }));
  out.sort((a, b) => b.budgetDay - a.budgetDay); // ranked by daily budget consumed, highest first
  return out;
}

function computeBkBenchmarks(rows) {
  const agg = {}; // brand||type -> {budget, sales}
  rows.forEach(r => {
    const key = `${r.brand}||${r.ktype}`;
    if (!agg[key]) agg[key] = { budget: 0, sales: 0 };
    agg[key].budget += r.estBudget;
    agg[key].sales += r.directSales;
  });
  const bench = {};
  Object.keys(agg).forEach(k => { bench[k] = agg[k].budget > 0 ? agg[k].sales / agg[k].budget : 0; });
  return bench; // blended Direct RoAS per brand||type
}

// ---------------------------------------------------------------------------
// Small hooks
// ---------------------------------------------------------------------------
function useDebounced(value, ms) {
  const [v, setV] = React.useState(value);
  React.useEffect(() => {
    const t = setTimeout(() => setV(value), ms);
    return () => clearTimeout(t);
  }, [value, ms]);
  return v;
}

// Row virtualization: lets a scrollable table hold thousands of rows without
// freezing the browser tab. Only the rows in (and just around) the visible
// viewport are ever mounted in the DOM; two spacer <tr>s of the right height
// stand in for everything scrolled out of view, so the scrollbar still feels
// like it holds the full row count and scrolling stays smooth.
const VROW_HEIGHT = 40; // px — must match the CSS row height below
const VROW_OVERSCAN = 10; // extra rows rendered above/below the viewport

function useVirtualRows(scrollRef, itemCount, rowHeight = VROW_HEIGHT, overscan = VROW_OVERSCAN) {
  const [scrollTop, setScrollTop] = React.useState(0);
  const [viewportH, setViewportH] = React.useState(600);

  React.useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const onScroll = () => setScrollTop(el.scrollTop);
    const measure = () => setViewportH(el.clientHeight || 600);
    measure();
    onScroll();
    el.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', measure);
    return () => {
      el.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', measure);
    };
  }, [scrollRef]);

  const startIndex = Math.max(0, Math.floor(scrollTop / rowHeight) - overscan);
  const visibleCount = Math.ceil(viewportH / rowHeight) + overscan * 2;
  const endIndex = Math.min(itemCount, startIndex + visibleCount);
  return { startIndex, endIndex };
}

// ---------------------------------------------------------------------------
// Small shared components
// ---------------------------------------------------------------------------
function Kpi({ label, value }) {
  return (
    <div className="kpi-card">
      <div className="label">{label}</div>
      <div className="value">{value}</div>
    </div>
  );
}

function TypeBadge({ type }) {
  const t = String(type || '').toLowerCase();
  const cls = t === 'competition' ? 'type-competition' : t === 'branded' ? 'type-branded' : 'type-generic';
  return <span className={`badge ${cls}`}>{type || 'Generic'}</span>;
}

// Multi-select filter: a button showing the current selection summary, with a
// checkbox dropdown panel. An empty `selected` array means "All" (no filter
// applied) — this matches how every other filter in the app defaults to All.
function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);

  React.useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, [open]);

  const toggle = (opt) => {
    onChange(selected.includes(opt) ? selected.filter(v => v !== opt) : [...selected, opt]);
  };
  const buttonLabel = selected.length === 0
    ? `All ${label}`
    : selected.length === 1
      ? selected[0]
      : `${selected.length} ${label} selected`;

  return (
    <div className="multiselect" ref={ref}>
      <button type="button" className={`ms-btn ${selected.length ? 'active' : ''}`} onClick={() => setOpen(o => !o)}>
        {buttonLabel}<span className="ms-caret">▾</span>
      </button>
      {open && (
        <div className="ms-panel">
          <div className="ms-panel-actions">
            <button type="button" onClick={() => onChange([])}>Clear</button>
            <button type="button" onClick={() => onChange(options)}>Select all</button>
          </div>
          {options.map(opt => (
            <label key={opt} className="ms-opt">
              <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} />
              {opt}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

function exportToExcel(rows, columns, filename) {
  const data = rows.map(r => {
    const o = {};
    columns.forEach(c => { o[c.label] = c.get(r); });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(data);
  const range = XLSX.utils.decode_range(ws['!ref']);
  ws['!autofilter'] = { ref: XLSX.utils.encode_range(range) };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, filename);
}

function KwExplorerTab({ recoRows, catRevFn, salesConfigured }) {
  const [q, setQ] = React.useState('');
  const qd = useDebounced(q, 200);
  const [brands, setBrands] = React.useState([]);       // [] = All
  const [categories, setCategories] = React.useState([]); // [] = All
  const [ktypes, setKtypes] = React.useState([]);         // [] = All
  const [trendingOnly, setTrendingOnly] = React.useState(false);
  const [sortKey, setSortKey] = React.useState('searches');
  const [sortDir, setSortDir] = React.useState('desc');

  const SORT_IS_NUM = { keyword: false, searches: true, brand: false, primaryCategory: false, ktype: false };
  const handleSort = (key) => {
    if (key === sortKey) { setSortDir(d => (d === 'asc' ? 'desc' : 'asc')); return; }
    setSortKey(key);
    setSortDir(SORT_IS_NUM[key] ? 'desc' : 'asc');
  };
  const sortArrow = (key) => (key === sortKey ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '');

  const rows = React.useMemo(() => aggregateReco(recoRows, catRevFn), [recoRows, catRevFn]);

  const brandOptions = React.useMemo(() => Array.from(new Set(rows.map(r => r.brand))).sort(), [rows]);
  const categoryOptions = React.useMemo(() => Array.from(new Set(rows.map(r => r.primaryCategory).filter(Boolean))).sort(), [rows]);
  const ktypeOptions = React.useMemo(() => Array.from(new Set(rows.map(r => r.ktype))).sort(), [rows]);

  const filtered = rows.filter(r => {
    if (brands.length && !brands.includes(r.brand)) return false;
    if (categories.length && !categories.includes(r.primaryCategory)) return false;
    if (ktypes.length && !ktypes.includes(r.ktype)) return false;
    if (trendingOnly && !r.trending) return false;
    if (qd && r.keyword.toLowerCase().indexOf(qd.toLowerCase()) < 0) return false;
    return true;
  });

  const sorted = React.useMemo(() => {
    const arr = filtered.slice();
    const dir = sortDir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (SORT_IS_NUM[sortKey]) return (av - bv) * dir;
      const as = String(av || '').toLowerCase(), bs = String(bv || '').toLowerCase();
      return as < bs ? -1 * dir : as > bs ? 1 * dir : 0;
    });
    return arr;
  }, [filtered, sortKey, sortDir]);

  const kpis = React.useMemo(() => ({
    suggested: rows.length,
    trending: rows.filter(r => r.trending).length,
  }), [rows]);

  return (
    <div>
      {!salesConfigured && (
        <div className="banner warn">
          Category ranking is using search volume as a proxy (no <code>CONFIG.SALES_WORKBOOK_ID</code> configured),
          not true revenue. Plug in your Sales-import feed for revenue-ranked categories (see README).
        </div>
      )}

      <div className="kpi-row">
        <Kpi label="Suggested keywords" value={fmtInt(kpis.suggested)} />
        <Kpi label="Trending" value={fmtInt(kpis.trending)} />
      </div>

      <div className="filters">
        <input type="text" placeholder="Search keyword…" value={q} onChange={e => setQ(e.target.value)} />
        <MultiSelect label="brands" options={brandOptions} selected={brands} onChange={setBrands} />
        <MultiSelect label="categories" options={categoryOptions} selected={categories} onChange={setCategories} />
        <MultiSelect label="types" options={ktypeOptions} selected={ktypes} onChange={setKtypes} />
        <label className="chk"><input type="checkbox" checked={trendingOnly} onChange={e => setTrendingOnly(e.target.checked)} /> 🔥 Trending only</label>
      </div>

      <div className="toolbar-row">
        <button className="export-btn" onClick={() => exportToExcel(sorted, [
          { label: 'Keyword', get: r => r.keyword },
          { label: 'Search DRR (max 14d)', get: r => Math.round(r.searches) },
          { label: 'Brand', get: r => r.brand },
          { label: 'Primary Category', get: r => r.primaryCategory },
          { label: 'Other Categories', get: r => r.categories.slice(1).map(c => c.category).join(', ') },
          { label: 'Type', get: r => r.ktype },
          { label: 'Trending', get: r => r.trending ? 'Yes' : 'No' },
        ], 'blinkit_suggested_keywords_export.xlsx')}>⬇ Excel</button>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th className="kw-col sortable" onClick={() => handleSort('keyword')}>Keyword{sortArrow('keyword')}</th>
              <th className="num sortable" onClick={() => handleSort('searches')}>Search DRR{sortArrow('searches')}</th>
              <th className="sortable" onClick={() => handleSort('brand')}>Brand{sortArrow('brand')}</th>
              <th className="sortable" onClick={() => handleSort('primaryCategory')}>Category{sortArrow('primaryCategory')}</th>
              <th className="sortable" onClick={() => handleSort('ktype')}>Type{sortArrow('ktype')}</th>
            </tr>
          </thead>
          <tbody>
            {sorted.length === 0 && (
              <tr><td colSpan="5"><div className="empty-state">No keywords match these filters.</div></td></tr>
            )}
            {sorted.map(r => (
              <tr key={r.brand + '||' + r.keyword}>
                <td className="kw-cell">{r.keyword}{r.trending && <span className="badge fire type-competition">🔥</span>}</td>
                <td className="num">{fmtInt(r.searches)}</td>
                <td>{r.brand}</td>
                <td>
                  <span className="cat-primary">{r.primaryCategory || '—'}</span>
                  {r.moreCount > 0 && <span className="cat-more" title={r.categories.slice(1).map(c => c.category).join(', ')}>+{r.moreCount} more</span>}
                </td>
                <td><TypeBadge type={r.ktype} /></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="footnote">Click a column header to sort (click again to flip direction) — default is Search DRR, high to low. Search DRR = max 30-day search volume seen in the last 14 days, per keyword × brand. Categories ranked by {salesConfigured ? 'revenue' : 'search volume (revenue feed not configured)'}.</div>
    </div>
  );
}

// ===========================================================================
// Tab 2: AZ Running Keywords (Amazon keyword performance — no Blinkit tie-in)
// ===========================================================================
function AzGapsTab({ azRows }) {
  const [q, setQ] = React.useState('');
  const qd = useDebounced(q, 200);
  const [brand, setBrand] = React.useState('All');
  const [ktype, setKtype] = React.useState('All');
  const [qualifiedOnly, setQualifiedOnly] = React.useState(true);
  const [volFloor, setVolFloor] = React.useState(100);
  const [convPct, setConvPct] = React.useState(50);
  const [sortKey, setSortKey] = React.useState('volDay');
  const [sortDir, setSortDir] = React.useState('desc');

  const SORT_IS_NUM = { keyword: false, volDay: true, unitsDay: true, conv: true, bench: true, brand: false, ktype: false };
  const handleSort = (key) => {
    if (key === sortKey) { setSortDir(d => (d === 'asc' ? 'desc' : 'asc')); return; }
    setSortKey(key);
    setSortDir(SORT_IS_NUM[key] ? 'desc' : 'asc'); // numbers default high-to-low, text default A-Z
  };
  const sortArrow = (key) => (key === sortKey ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '');

  // aggregateAmazon/fetch/parse never see qualifiedOnly, volFloor or convPct —
  // these are pure display-layer filters computed below; they cannot change
  // what was fetched from the sheet or what's sitting in the IndexedDB cache.
  const aggregated = React.useMemo(() => aggregateAmazon(azRows), [azRows]);
  const benchmarks = React.useMemo(() => computeBenchmarks(azRows), [azRows]);

  const rows = React.useMemo(() => aggregated.map(r => {
    const bench = benchmarks[`${r.brand}||${r.ktype}`] || 0;
    const floor = bench * (convPct / 100);
    const qualifies = r.volDay >= volFloor && r.conv >= floor;
    return { ...r, bench, floor, qualifies };
  }), [aggregated, benchmarks, volFloor, convPct]);

  const brands = React.useMemo(() => ['All', ...Array.from(new Set(rows.map(r => r.brand))).sort()], [rows]);
  const ktypes = React.useMemo(() => ['All', ...Array.from(new Set(rows.map(r => r.ktype))).sort()], [rows]);

  const filtered = rows.filter(r => {
    if (brand !== 'All' && r.brand !== brand) return false;
    if (ktype !== 'All' && r.ktype !== ktype) return false;
    if (qualifiedOnly && !r.qualifies) return false;
    if (qd && r.keyword.toLowerCase().indexOf(qd.toLowerCase()) < 0) return false;
    return true;
  });

  const sorted = React.useMemo(() => {
    const arr = filtered.slice();
    const dir = sortDir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (SORT_IS_NUM[sortKey]) return (av - bv) * dir;
      const as = String(av).toLowerCase(), bs = String(bv).toLowerCase();
      return as < bs ? -1 * dir : as > bs ? 1 * dir : 0;
    });
    return arr;
  }, [filtered, sortKey, sortDir]);

  // Virtualize the main table so "Qualified only" off (thousands of rows,
  // the full AZ Search snapshot dump) scrolls smoothly instead of freezing
  // the tab — only ~viewport-height-worth of rows are ever in the DOM.
  const scrollRef = React.useRef(null);
  const { startIndex, endIndex } = useVirtualRows(scrollRef, sorted.length);
  const visibleRows = sorted.slice(startIndex, endIndex);
  const topPad = startIndex * VROW_HEIGHT;
  const bottomPad = (sorted.length - endIndex) * VROW_HEIGHT;

  // Brand-wise summary of what's currently in view (updates as filters change).
  const brandSummary = React.useMemo(() => {
    const map = {};
    filtered.forEach(r => {
      if (!map[r.brand]) map[r.brand] = { brand: r.brand, keywords: 0, units: 0, vol: 0 };
      map[r.brand].keywords += 1;
      map[r.brand].units += r.unitsDay;
      map[r.brand].vol += r.volDay;
    });
    const list = Object.values(map).sort((a, b) => b.vol - a.vol);
    const total = list.reduce((acc, r) => ({
      keywords: acc.keywords + r.keywords,
      units: acc.units + r.units,
      vol: acc.vol + r.vol,
    }), { keywords: 0, units: 0, vol: 0 });
    return { list, total };
  }, [filtered]);

  const benchCaption = React.useMemo(() => {
    return Object.keys(benchmarks).sort().map(k => {
      const [b, t] = k.split('||');
      return `${b}·${t} ${(benchmarks[k] * 100).toFixed(2)}%`;
    }).join('  ·  ');
  }, [benchmarks]);

  return (
    <div>
      <div className="table-wrap" style={{ marginBottom: 16, maxHeight: 'none' }}>
        <table className="data">
          <thead>
            <tr>
              <th className="kw-col">Brand</th>
              <th className="num">Keywords targeted</th>
              <th className="num">Units sold/day</th>
              <th className="num">Keyword volume/day</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td className="kw-cell">TOTAL</td>
              <td className="num">{fmtInt(brandSummary.total.keywords)}</td>
              <td className="num">{fmt1dp(brandSummary.total.units)}</td>
              <td className="num">{fmtInt(brandSummary.total.vol)}</td>
            </tr>
            {brandSummary.list.map(b => (
              <tr key={b.brand}>
                <td className="kw-cell">{b.brand}</td>
                <td className="num">{fmtInt(b.keywords)}</td>
                <td className="num">{fmt1dp(b.units)}</td>
                <td className="num">{fmtInt(b.vol)}</td>
              </tr>
            ))}
            {brandSummary.list.length === 0 && (
              <tr><td colSpan="4"><div className="empty-state">No keywords match these filters.</div></td></tr>
            )}
          </tbody>
        </table>
      </div>

      <div className="filters">
        <input type="text" placeholder="Search keyword…" value={q} onChange={e => setQ(e.target.value)} />
        <select value={brand} onChange={e => setBrand(e.target.value)}>
          {brands.map(b => <option key={b} value={b}>{b === 'All' ? 'All brands' : b}</option>)}
        </select>
        <select value={ktype} onChange={e => setKtype(e.target.value)}>
          {ktypes.map(t => <option key={t} value={t}>{t === 'All' ? 'All types' : t}</option>)}
        </select>
        <label className="chk"><input type="checkbox" checked={qualifiedOnly} onChange={e => setQualifiedOnly(e.target.checked)} /> ✅ Qualified only</label>

// ===========================================================================
// Tab 3: BK Running Ads (Blinkit's own keyword ad-performance log)
// ===========================================================================
function BkAdsTab({ bkRows }) {
  const [q, setQ] = React.useState('');
  const qd = useDebounced(q, 200);
  const [brand, setBrand] = React.useState('All');
  const [category, setCategory] = React.useState('All');
  const [ktype, setKtype] = React.useState('All');
  const [qualifiedOnly, setQualifiedOnly] = React.useState(false);
  const [budgetFloor, setBudgetFloor] = React.useState(50);
  const [roasPct, setRoasPct] = React.useState(50);
  const [sortKey, setSortKey] = React.useState('budgetDay');
  const [sortDir, setSortDir] = React.useState('desc');

  const SORT_IS_NUM = { keyword: false, ktype: false, brand: false, category: false, compBrand: false, budgetDay: true, directQtyDay: true, newUsersDay: true, roas: true, bench: true };
  const handleSort = (key) => {
    if (key === sortKey) { setSortDir(d => (d === 'asc' ? 'desc' : 'asc')); return; }
    setSortKey(key);
    setSortDir(SORT_IS_NUM[key] ? 'desc' : 'asc');
  };
  const sortArrow = (key) => (key === sortKey ? (sortDir === 'asc' ? ' ▲' : ' ▼') : '');

  // aggregateBkAds/fetch/parse never see qualifiedOnly, budgetFloor or roasPct —
  // these are pure display-layer filters computed below; they cannot change
  // what was fetched from the sheet or what's sitting in the IndexedDB cache.
  const aggregated = React.useMemo(() => aggregateBkAds(bkRows), [bkRows]);
  const benchmarks = React.useMemo(() => computeBkBenchmarks(aggregated), [aggregated]);

  const rows = React.useMemo(() => aggregated.map(r => {
    const bench = benchmarks[`${r.brand}||${r.ktype}`] || 0;
    const floor = bench * (roasPct / 100);
    const qualifies = r.budgetDay >= budgetFloor && r.roas >= floor;
    return { ...r, bench, floor, qualifies };
  }), [aggregated, benchmarks, budgetFloor, roasPct]);

  const brands = React.useMemo(() => ['All', ...Array.from(new Set(rows.map(r => r.brand))).sort()], [rows]);
  const categories = React.useMemo(() => ['All', ...Array.from(new Set(rows.map(r => r.category))).filter(Boolean).sort()], [rows]);
  const ktypes = React.useMemo(() => ['All', ...Array.from(new Set(rows.map(r => r.ktype))).sort()], [rows]);

  const filtered = rows.filter(r => {
    if (brand !== 'All' && r.brand !== brand) return false;
    if (category !== 'All' && r.category !== category) return false;
    if (ktype !== 'All' && r.ktype !== ktype) return false;
    if (qualifiedOnly && !r.qualifies) return false;
    if (qd && r.keyword.toLowerCase().indexOf(qd.toLowerCase()) < 0) return false;
    return true;
  });

  const sorted = React.useMemo(() => {
    const arr = filtered.slice();
    const dir = sortDir === 'asc' ? 1 : -1;
    arr.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (SORT_IS_NUM[sortKey]) return (av - bv) * dir;
      const as = String(av || '').toLowerCase(), bs = String(bv || '').toLowerCase();
      return as < bs ? -1 * dir : as > bs ? 1 * dir : 0;
    });
    return arr;
  }, [filtered, sortKey, sortDir]);

  // Virtualize — BK Running Ads can run to ~2,000 keywords today and only grows
  // as more months of data accumulate in the source sheet.
  const scrollRef = React.useRef(null);
  const { startIndex, endIndex } = useVirtualRows(scrollRef, sorted.length);
  const visibleRows = sorted.slice(startIndex, endIndex);
  const topPad = startIndex * VROW_HEIGHT;
  const bottomPad = (sorted.length - endIndex) * VROW_HEIGHT;

  const benchCaption = React.useMemo(() => {
    return Object.keys(benchmarks).sort().map(k => {
      const [b, t] = k.split('||');
      return `${b}·${t} ${benchmarks[k].toFixed(2)}x`;
    }).join('  ·  ');
  }, [benchmarks]);

  return (
    <div>
      <div className="filters">
        <input type="text" placeholder="Search keyword…" value={q} onChange={e => setQ(e.target.value)} />
        <select value={brand} onChange={e => setBrand(e.target.value)}>
          {brands.map(b => <option key={b} value={b}>{b === 'All' ? 'All brands' : b}</option>)}
        </select>
        <select value={category} onChange={e => setCategory(e.target.value)}>
          {categories.map(c => <option key={c} value={c}>{c === 'All' ? 'All categories' : c}</option>)}
        </select>
        <select value={ktype} onChange={e => setKtype(e.target.value)}>
          {ktypes.map(t => <option key={t} value={t}>{t === 'All' ? 'All types' : t}</option>)}
        </select>
        <label className="chk"><input type="checkbox" checked={qualifiedOnly} onChange={e => setQualifiedOnly(e.target.checked)} /> ✅ Qualified only</label>
        <div className="num-inline">Budget floor/day ≥ ₹<input type="number" value={budgetFloor} onChange={e => setBudgetFloor(Number(e.target.value) || 0)} /></div>
        <div className="num-inline">RoAS ≥ <input type="number" value={roasPct} onChange={e => setRoasPct(Number(e.target.value) || 0)} />% of benchmark</div>
        {benchCaption && <div className="caption">Blended Direct RoAS by brand·type (used as the benchmark column): {benchCaption}</div>}
      </div>

      <div className="toolbar-row">
        <button className="export-btn" onClick={() => exportToExcel(sorted, [
          { label: 'Keyword', get: r => r.keyword },
          { label: 'Type', get: r => r.ktype },
          { label: 'Brand', get: r => r.brand },
          { label: 'Category', get: r => r.category },
          { label: 'Comp Brand', get: r => r.compBrand },
          { label: 'Budget Consumed/day', get: r => Number(r.budgetDay.toFixed(1)) },
          { label: 'Direct Qty Sold/day', get: r => Number(r.directQtyDay.toFixed(2)) },
          { label: 'New Users/day', get: r => Number(r.newUsersDay.toFixed(2)) },
          { label: 'Direct RoAS', get: r => Number(r.roas.toFixed(2)) },
          { label: 'Benchmark RoAS', get: r => Number(r.bench.toFixed(2)) },
        ], 'bk_running_ads_export.xlsx')}>⬇ Excel</button>
      </div>

      <div className="table-wrap" ref={scrollRef}>
        <table className="data virtual">
          <thead>
            <tr>
              <th className="kw-col sortable" onClick={() => handleSort('keyword')}>Keyword{sortArrow('keyword')}</th>
              <th className="sortable" onClick={() => handleSort('ktype')}>Type{sortArrow('ktype')}</th>
              <th className="sortable" onClick={() => handleSort('brand')}>Brand{sortArrow('brand')}</th>
              <th className="sortable" onClick={() => handleSort('category')}>Category{sortArrow('category')}</th>
              <th className="sortable" onClick={() => handleSort('compBrand')}>Comp Brand{sortArrow('compBrand')}</th>
              <th className="num sortable" onClick={() => handleSort('budgetDay')}>Budget Consumed/day{sortArrow('budgetDay')}</th>
              <th className="num sortable" onClick={() => handleSort('directQtyDay')}>Direct Qty Sold/day{sortArrow('directQtyDay')}</th>
              <th className="num sortable" onClick={() => handleSort('newUsersDay')}>New Users/day{sortArrow('newUsersDay')}</th>
              <th className="num sortable" onClick={() => handleSort('roas')}>Direct RoAS{sortArrow('roas')}</th>
              <th className="num sortable" onClick={() => handleSort('bench')}>Benchmark RoAS{sortArrow('bench')}</th>
            </tr>
          </thead>
          <tbody>
            {sorted.length === 0 && (
              <tr><td colSpan="10"><div className="empty-state">No keywords match these filters.</div></td></tr>
            )}
            {topPad > 0 && (
              <tr aria-hidden="true" style={{ height: topPad }}><td colSpan="10" style={{ padding: 0, border: 'none' }} /></tr>
            )}
            {visibleRows.map(r => (
              <tr key={r.brand + '||' + r.keyword}>
                <td className="kw-cell">{r.keyword}</td>
                <td><TypeBadge type={r.ktype} /></td>
                <td>{r.brand}</td>
                <td>{r.category || '—'}</td>
                <td>{r.compBrand || '—'}</td>
                <td className="num">₹{fmt1dp(r.budgetDay)}</td>
                <td className="num">{fmt1dp(r.directQtyDay)}</td>
                <td className="num">{fmt1dp(r.newUsersDay)}</td>
                <td className="num">{r.roas.toFixed(2)}x</td>
                <td className="num">{r.bench.toFixed(2)}x</td>
              </tr>
            ))}
            {bottomPad > 0 && (
              <tr aria-hidden="true" style={{ height: bottomPad }}><td colSpan="10" style={{ padding: 0, border: 'none' }} /></tr>
            )}
          </tbody>
        </table>
      </div>
      <div className="footnote">Click a column header to sort (click again to flip direction) — default is Budget Consumed/day, high to low. Showing {fmtInt(sorted.length)} keywords. All /day figures are the last {LOOKBACK_DAYS_BK}-day window's totals divided by however many distinct days of data actually exist in that window (so it stays a true daily run-rate even if the tracker has gaps). Direct RoAS = Direct Sales ÷ Estimated Budget Consumed over that same window. Benchmark RoAS is the blended Direct RoAS for that keyword's brand × type — Direct RoAS is compared against it (as a % of benchmark) by the Qualified-only filter above.</div>
    </div>
  );
}

// ===========================================================================
// App shell
// ===========================================================================
function App() {
  const [tab, setTab] = React.useState('kw');
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  const [recoText, setRecoText] = React.useState('');
  const [azText, setAzText] = React.useState('');
  const [bkAdsText, setBkAdsText] = React.useState('');
  const [salesText, setSalesText] = React.useState('');
  const [lastLoaded, setLastLoaded] = React.useState(null);
  const [refreshTick, setRefreshTick] = React.useState(0);

  const salesConfigured = !!CONFIG.SALES_WORKBOOK_ID;

  React.useEffect(() => {
    let cancelled = false;
    // refreshTick 0 is the initial mount load (cache OK, fast); any click on
    // "Refresh data" bumps refreshTick and forces a real network re-fetch —
    // otherwise refresh could silently keep serving up-to-4h-old data.
    const force = refreshTick > 0;
    async function load() {
      setLoading(true);
      setError(null);
      try {
        const jobs = [
          fetchSheetCSV(CONFIG.RECO_WORKBOOK_ID, CONFIG.RECO_TAB_GID, 'reco_bk', force),
          fetchSheetCSV(CONFIG.RECO_WORKBOOK_ID, CONFIG.AZ_SNAPSHOT_GID, 'az_snap', force),
          fetchSheetCSV(CONFIG.BK_ADS_WORKBOOK_ID, CONFIG.BK_ADS_TAB_GID, 'bk_ads', force),
        ];
        if (salesConfigured) jobs.push(fetchSheetCSV(CONFIG.SALES_WORKBOOK_ID, CONFIG.SALES_TAB_GID, 'sales_import', force));
        const results = await Promise.all(jobs);
        if (cancelled) return;
        setRecoText(results[0].text || '');
        setAzText(results[1].text || '');
        setBkAdsText(results[2].text || '');
        if (salesConfigured) setSalesText(results[3].text || '');
        setLastLoaded(new Date());
      } catch (err) {
        if (!cancelled) setError(err.message || String(err));
      } finally {
        if (!cancelled) setLoading(false);
      }
    }
    load();
    return () => { cancelled = true; };
  }, [refreshTick]);

  const recoRows = React.useMemo(() => recoText ? parseRecoKeywords(recoText) : [], [recoText]);
  const azRows = React.useMemo(() => azText ? parseAmazonSnapshot(azText) : [], [azText]);
  const bkRows = React.useMemo(() => bkAdsText ? parseBkAdsRows(bkAdsText) : [], [bkAdsText]);
  const salesRows = React.useMemo(() => salesText ? parseSalesRows(salesText) : [], [salesText]);
  const catRevMap = React.useMemo(() => buildCatRevMap(salesRows), [salesRows]);
  const catRevFn = React.useCallback((brand, category) => {
    if (!salesConfigured) return null;
    const v = catRevMap[`${brand}||${category}`];
    return v === undefined ? 0 : v;
  }, [catRevMap, salesConfigured]);

  return (
    <div className="app">
      <div className="app-header">
        <div>
          <h1>🔎 Marketplace Keyword Explorer</h1>
          <div className="sub">
            {lastLoaded ? `Data as of ${lastLoaded.toLocaleString('en-IN')} (cached 4h)` : 'Loading…'}
          </div>
        </div>
        <button className="refresh-btn" disabled={loading} onClick={() => setRefreshTick(t => t + 1)}>
          {loading ? 'Refreshing…' : '↻ Refresh data'}
        </button>
      </div>

      <div className="tabs">
        <button className={`tab-btn ${tab === 'kw' ? 'active' : ''}`} onClick={() => setTab('kw')}>🔎 Blinkit Suggested Keywords</button>
        <button className={`tab-btn ${tab === 'az' ? 'active' : ''}`} onClick={() => setTab('az')}>🅰 AZ Running Keywords</button>
        <button className={`tab-btn ${tab === 'bk' ? 'active' : ''}`} onClick={() => setTab('bk')}>🅱 BK Running Ads</button>
      </div>

      {error && <div className="banner error">Couldn't load sheet data: {error}. Check that the workbook is link-shared and the gid is correct.</div>}
      {loading && !lastLoaded && <div className="loading-state">Loading keyword data…</div>}

      {!loading || lastLoaded ? (
        tab === 'kw'
          ? <KwExplorerTab recoRows={recoRows} catRevFn={catRevFn} salesConfigured={salesConfigured} />
          : tab === 'az'
            ? <AzGapsTab azRows={azRows} />
            : <BkAdsTab bkRows={bkRows} />
      ) : null}
    </div>
  );
}

// ===========================================================================
// Access control — Google Sign-In, restricted to AUTH_CONFIG.ALLOWED_DOMAIN
// ===========================================================================
const AUTH_LS_KEY = 'mkt_kwexpl_auth';

// Decodes a Google ID token's payload. This does NOT verify the token's
// signature -- that's the honest limitation of a purely client-side, no-
// backend gate. It stops casual/accidental access by anyone without a real
// mosaicwellness.in Google sign-in going through the actual button below;
// it is not a hard security boundary against someone opening devtools and
// forging a callback. For that, put the Vercel deployment behind Vercel's
// own Password Protection (Project Settings -> Deployment Protection) as
// well, or verify the token server-side in a Vercel serverless function.
function decodeJwtPayload(token) {
  try {
    const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(b64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function isAllowedPayload(payload) {
  if (!payload || !payload.email_verified) return false;
  const email = String(payload.email || '').toLowerCase();
  const domain = AUTH_CONFIG.ALLOWED_DOMAIN.toLowerCase();
  return payload.hd === domain || email.endsWith('@' + domain);
}

function loadAuthSession() {
  try {
    const raw = JSON.parse(localStorage.getItem(AUTH_LS_KEY) || 'null');
    if (raw && raw.email && raw.exp > Date.now()) return raw;
  } catch (e) { /* ignore */ }
  return null;
}
function saveAuthSession(email) {
  const session = { email, exp: Date.now() + AUTH_CONFIG.SESSION_HOURS * 3600000 };
  try { localStorage.setItem(AUTH_LS_KEY, JSON.stringify(session)); } catch (e) {}
  return session;
}
function clearAuthSession() {
  try { localStorage.removeItem(AUTH_LS_KEY); } catch (e) {}
}

function GoogleSignInGate({ children }) {
  const gated = !!AUTH_CONFIG.GOOGLE_CLIENT_ID;
  const [session, setSession] = React.useState(() => gated ? loadAuthSession() : null);
  const [denied, setDenied] = React.useState(null); // email that was rejected, if any
  const [gsiError, setGsiError] = React.useState(null);
  const buttonRef = React.useRef(null);

  const handleCredential = React.useCallback((resp) => {
    const payload = decodeJwtPayload(resp.credential);
    if (isAllowedPayload(payload)) {
      setDenied(null);
      setSession(saveAuthSession(payload.email));
    } else {
      setDenied(payload && payload.email);
    }
  }, []);

  React.useEffect(() => {
    if (!gated || session) return;
    let cancelled = false;
    const init = () => {
      if (cancelled || !window.google || !window.google.accounts) return;
      try {
        window.google.accounts.id.initialize({ client_id: AUTH_CONFIG.GOOGLE_CLIENT_ID, callback: handleCredential });
        if (buttonRef.current) {
          window.google.accounts.id.renderButton(buttonRef.current, { theme: 'outline', size: 'large', width: 280 });
        }
      } catch (e) { setGsiError(String(e.message || e)); }
    };
    if (window.google && window.google.accounts) {
      init();
    } else {
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.onload = init;
      script.onerror = () => setGsiError('Could not load Google Sign-In script.');
      document.head.appendChild(script);
    }
    return () => { cancelled = true; };
  }, [gated, session, handleCredential]);

  const signOut = () => {
    clearAuthSession();
    setSession(null);
    if (window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect();
  };

  if (!gated) return children; // AUTH_CONFIG.GOOGLE_CLIENT_ID not set -- app stays open

  if (session) {
    return (
      <React.Fragment>
        <div className="auth-bar">Signed in as {session.email} · <button className="auth-signout" onClick={signOut}>Sign out</button></div>
        {children}
      </React.Fragment>
    );
  }

  return (
    <div className="auth-gate">
      <div className="auth-card">
        <h1>🔎 Marketplace Keyword Explorer</h1>
        <p>Sign in with your <b>@{AUTH_CONFIG.ALLOWED_DOMAIN}</b> Google account to continue.</p>
        <div ref={buttonRef} className="auth-btn-slot" />
        {denied && <div className="banner error" style={{ marginTop: 14 }}>
          {denied || 'That account'} isn't on @{AUTH_CONFIG.ALLOWED_DOMAIN} -- access is restricted to that domain.
        </div>}
        {gsiError && <div className="banner error" style={{ marginTop: 14 }}>{gsiError}</div>}
      </div>
    </div>
  );
}

function startApp() {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<GoogleSignInGate><App /></GoogleSignInGate>);
}

window.startApp = startApp;
startApp();
</script>

<script>
  // The source script above is deliberately NOT type="text/babel" -- Babel
  // standalone auto-scans and executes any text/babel script on its own as
  // soon as it loads, which would run this code a second time (in addition
  // to the manual transform below) and throw "Identifier already declared".
  // Using a type Babel doesn't recognize keeps this the only execution path.
  //
  // We also transform with the CLASSIC runtime explicitly. Babel's
  // "automatic" runtime (the default since preset-react 7.9+) tries to
  // import from "react/jsx-runtime", which does not resolve in a plain
  // UMD/CDN setup with no module bundler -> blank page with a console
  // error. Forcing runtime:"classic" makes it call React.createElement
  // directly, which works with the UMD React build loaded above.
  (function () {
    var src = document.getElementById('app-source').textContent;
    var out = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'app.jsx',
    }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
